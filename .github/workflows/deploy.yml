name: Deploy Quartz to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone and install Quartz
        run: |
          git clone --branch v5 https://github.com/jackyzha0/quartz.git quartz-build
          cd quartz-build && npm ci

      - name: Configure Quartz
        run: |
          cd quartz-build
          cp quartz.config.default.yaml quartz.config.yaml
          sed -i 's|title: "Quartz 5"|title: "Recipes"|' quartz.config.yaml
          sed -i 's|baseUrl: "quartz.jzhao.xyz"|baseUrl: "hsteinshiromoto.github.io/recipes"|' quartz.config.yaml

      - name: Copy vault content into Quartz
        run: |
          rsync -av --exclude='.git' \
                    --exclude='.obsidian' \
                    --exclude='.claude' \
                    --exclude='quartz-build' \
                    --exclude='journal' \
                    --exclude='plans' \
                    --exclude='flake.nix' \
                    --exclude='flake.lock' \
                    --exclude='Makefile' \
                    . quartz-build/content/

      - name: Install plugins
        run: cd quartz-build && npx quartz plugin install --from-config

      - name: Build Quartz site
        run: cd quartz-build && npx quartz build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: quartz-build/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
